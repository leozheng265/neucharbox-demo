<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live cards QA</title>
<link rel="stylesheet" href="../css/app.css">
<style>
  /* every card state, one after another; the page scrolls, not the log */
  body { height: auto; overflow-y: auto; }
  .qa { max-width: 440px; margin: 0 auto; }
  .qa .chat { height: auto; }
  .qa .chat-log { overflow: visible; flex: none; }
  #qaResult { font: 12px/1.4 monospace; padding: 8px 14px; background: #fff; border-bottom: 1px solid var(--line); }
  #qaResult.bad { color: var(--red); white-space: pre-wrap; }
  /* the live tools under a two-column panel, as on a desktop side column */
  .qa .panel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 10px 12px; overflow: visible; }
  .qa .ent { min-width: 0; max-width: none; }
  .qa .ltools { max-height: none; }
</style>
</head>
<body>
<div id="qaResult">running…</div>
<div class="qa"><div class="panel" id="panel"></div><div class="ltools" id="ltools" hidden></div><div class="chat" id="chat"></div></div>
<script type="module">
// Live mode's page parts in a real browser, with the real CSS (no server): the guided end card's live button, the access
// card, the input bar as the disabled NCB terminal placeholder, a device card's action controls and the live tools
// (faults, Reset room, the event log). What test/live.mjs checks on a stand-in document, here with layout.
import { createChat } from '../js/engine/chat.js';
import { createLiveView } from '../js/engine/livechat.js';
import { createLiveTools } from '../js/engine/livetools.js';
import { createPanel } from '../js/engine/panel.js';
import { createStore } from '../js/engine/store.js';
import { LIVE_COPY, liveDevicesOf, eventLine } from '../js/engine/live.js';
import { HOME_DEVICES } from './fixtures/live-mock.mjs';
import home from '../js/scenes/home.js';

const problems = [];
const ok = (cond, what) => { if (!cond) problems.push(what); };
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const hr = (label) => { const d = document.createElement('div'); d.textContent = label; d.style.cssText = 'font:11px monospace;color:#8AA3A0;align-self:stretch'; $('#chatLog').appendChild(d); };

try {
  const chat = createChat($('#chat'), { onPromptText: () => { window.__sent = true; } });
  const view = createLiveView({ chat, scene: home });

  hr('1 guided end card');
  chat.end({ headline: 'Done', body: 'The guided request ran.' }, { onWhatIf() {}, whatIfLabel: 'What if something fails?', onLive() { window.__liveCalled = true; }, liveLabel: LIVE_COPY.button });
  const go = $('.card.end .live-go');
  ok(go && go.textContent === LIVE_COPY.button, 'live-go label');
  ok($('.card.end .row').firstElementChild === go, 'live-go first in the row');
  go.click(); ok(go.disabled && window.__liveCalled, 'live-go disables and calls onLive');

  hr('2 access: code (with a note), offline');
  let applyTries = 0;
  const acc = view.access({ mode: 'code', note: LIVE_COPY.savedCodeGone }, { onCode: async (c) => (c === 'GOOD' ? null : LIVE_COPY.badCode), onApply: async () => (++applyTries === 1 ? LIVE_COPY.applyRate : LIVE_COPY.applied), onBack() {} });
  const card = $('.card.access:not(.offline)');
  ok($('.intro', card).textContent === LIVE_COPY.accessIntro, 'access intro');
  ok($('.anote', card).textContent === LIVE_COPY.savedCodeGone, 'access note');
  ok($('form.code input[name=code]', card) && $('form.code button.go', card), 'code form');
  ok($('form.apply', card).hidden, 'apply form hidden at first');
  $('.apply-open', card).click();
  ok(!$('form.apply', card).hidden, 'Apply for access reveals the form');
  ok($('form.apply [name=interest]', card).value === 'home', 'interest defaults to home');
  const hp = $('form.apply input[name=website]', card);
  ok(hp.tabIndex === -1 && hp.closest('[aria-hidden=true]') && getComputedStyle(hp.closest('.hp')).left === '-9999px', 'honeypot off-screen');
  card.style.animation = 'none'; // its entry animation's transform would place the honeypot by itself
  ok(hp.closest('.hp').offsetParent === card, 'honeypot placed inside its card (not the page, which would then scroll)');
  ok($('form.apply .use', card).textContent === LIVE_COPY.applyEmailUse && $('form.apply [name=email]', card).getAttribute('aria-describedby') === $('form.apply .use', card).id, 'email sentence tied to the email field');
  ok($('button.back', card).textContent === LIVE_COPY.back, 'back button');
  for (const el of $$('input, select, textarea', card)) ok(parseFloat(getComputedStyle(el).fontSize) >= 16, `16px: ${el.name}`);
  card.querySelector('form.code input').value = 'nope'; card.querySelector('form.code').requestSubmit();
  await wait(30);
  ok($('.err', card).textContent === LIVE_COPY.badCode && !$('.err', card).hidden, 'bad code shows in .err');
  const af = $('form.apply', card).elements;
  af.email.value = 'a@b.co'; af.wouldTry.value = 'water the plant'; $('form.apply', card).requestSubmit(); await wait(30);
  ok($('.err', card).textContent === LIVE_COPY.applyRate && !$('.err', card).hidden && !$('p.applied', card), 'apply error shows in .err');
  $('form.apply', card).requestSubmit(); await wait(30);
  ok($('p.applied', card)?.textContent === LIVE_COPY.applied && !$('form.apply', card) && $('.err', card).hidden, 'applied replaces the form');
  view.access({ mode: 'offline' }, { onCode: async () => null, onApply: async () => null, onBack() {} });
  const off = $('.card.access.offline');
  ok($('.intro', off).textContent === LIVE_COPY.offline && $$('.social-link', off).length === 3 && $('.back', off), 'offline card');

  hr('3 live mode: the input bar is the NCB terminal placeholder, disabled');
  view.live(true);
  view.ncb(LIVE_COPY.intro(6));
  const form = $('#chatForm'), input = $('#chatText');
  ok(form.classList.contains('live') && input.placeholder === LIVE_COPY.terminal && input.getAttribute('aria-label') === LIVE_COPY.terminalLabel, 'placeholder and label');
  ok(input.disabled && form.querySelector('button').disabled, 'disabled');
  chat.enableInput(true); ok(input.disabled, 'enableInput(true) cannot turn it on while live');
  form.requestSubmit(); ok(!window.__sent, 'nothing is sent');
  ok(getComputedStyle(form, '::before').content === '"NCB"', 'the NCB badge');
  ok(getComputedStyle(form).display !== 'none' && input.offsetWidth > 0, 'the placeholder shows (on phones too)');

  hr("4 the cards' actions and the live tools");
  const initial = { env: { hour: 16.5 }, hub: { status: 'on', led: 1 }, plan: {} };
  for (const [id, d] of Object.entries(home.devices)) initial[id] = { status: 'online', ...d.initial };
  const store = createStore(initial), panel = createPanel($('#panel'), home, store), runs = [];
  panel.editable(true, { onEdit() {} });
  const tools = createLiveTools($('#ltools'), { slotFor: (id) => panel.slot(id), onRun: (...a) => runs.push(a), onPlant() {}, onClearFaults() {}, onReset() {} });
  tools.show(true); tools.devices(liveDevicesOf(HOME_DEVICES.map((d) => ({ ...d, status: 'online' })), home)); tools.controls({ enabled: true, acting: null }); tools.faults([{ device: 'pump', mode: 'blocked' }]);
  ok($$('.ent .act').length === 7, 'seven actions on the six cards');
  ok($('.ent[data-id="lamp"] .edits').nextElementSibling === $('.ent[data-id="lamp"] .acts'), 'the hand edits, then the actions');
  $('.ent[data-id="lamp"] .act-go').click(); ok(runs.length === 1 && runs[0][1] === 'set_lamp', 'a press runs');
  ok(!$('.ent[data-id="lamp"]').classList.contains('selected'), 'the card is not selected by its controls');
  tools.result('lamp', 'set_lamp', { ok: true, text: 'confirmed' });
  tools.result('soil', 'read_soil', { ok: false, text: 'not responding' });
  ok(getComputedStyle($('.ent[data-id="soil"] .act-res')).color !== getComputedStyle($('.ent[data-id="lamp"] .act-res')).color, 'a failed result is another colour');
  for (const [kind, d] of [['call', { device: 'lamp', label: 'Floor lamp → 40%' }], ['state', { path: 'lamp.brightness', value: 0.4 }], ['result', { device: 'lamp', ok: true, outcome: 'confirmed', text: 'confirmed' }],
    ['fault', { device: 'pump', text: 'not responding' }], ['world', { air: { temp: 21 }, light: { lux: 120 } }], ['clock', { label: 'Fri 17:30' }], ['timeline', { at: 'Fri 18:00', text: 'Sent you: someone at the door', ok: true, kind: 'notify' }]]) tools.log(eventLine(home, kind, d));
  ok($$('.lt-line').length === 7, 'seven log lines');
  tools.controls({ enabled: false, acting: { id: 'pump', verb: 'run_pump' } });
  ok($$('.act-go').every((b) => b.disabled) && $('.ent[data-id="pump"] .act-go').textContent === LIVE_COPY.running, 'busy: disabled, the running one says so');
  tools.controls({ enabled: true, acting: null });
  for (const el of $$('.lt-plant select, .ent .ap-sel')) ok(parseFloat(getComputedStyle(el).fontSize) >= (matchMedia('(max-width: 959px)').matches ? 16 : 12), `font size: ${el.className}`);

  hr('lost');
  view.lost(() => {});
  ok($$('.msg.ncb').some((m) => m.textContent === LIVE_COPY.lost) && $$('.card.action button').some((b) => b.textContent === LIVE_COPY.reconnect), 'lost + reconnect');

  // text, never HTML
  view.ncb('<img src=x onerror="window.__xss=1">'); tools.log({ kind: 'call', text: '<b>x</b>' });
  ok(!window.__xss && !$('.lt-line b'), 'server text is never HTML');

  // leaving live
  view.live(false);
  ok(!form.classList.contains('live') && input.placeholder === 'Or type what you want…' && input.getAttribute('aria-label') === 'Your request', 'live(false) restores');
  chat.enableInput(true); ok(!input.disabled, 'the guided input works again'); chat.enableInput(false);
  view.live(true);
  ok(document.documentElement.scrollWidth <= innerWidth, `no horizontal page scroll (${document.documentElement.scrollWidth} > ${innerWidth})`);
  acc.close(); ok($('.card.access').classList.contains('done'), 'access close()');
} catch (e) {
  problems.push(`threw: ${e.stack || e}`);
}
const out = $('#qaResult');
window.__qa = { problems };
out.textContent = problems.length ? `FAIL (${problems.length})\n${problems.join('\n')}` : 'OK: all live checks passed';
out.className = problems.length ? 'bad' : '';
</script>
</body>
</html>
