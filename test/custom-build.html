<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build your own QA</title>
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/custom.css">
<style>
  /* the inventory as the desktop side shows it; the page scrolls, not the grid */
  body { height: auto; overflow-y: auto; }
  #qaResult { font: 12px/1.4 monospace; padding: 8px 14px; background: #fff; border-bottom: 1px solid var(--line); }
  #qaResult.bad { color: var(--red); white-space: pre-wrap; }
  .qa { max-width: 480px; margin: 12px auto; border: 1px dashed var(--line-2); }
  .qa .inventory { display: flex; flex-direction: column; height: 620px; background: var(--panel); }
  .qa .note { min-height: 40px; padding: 8px 12px; font-size: 13px; }
</style>
</head>
<body>
<div id="qaResult">running…</div>
<div class="qa"><div class="inventory" id="inventory"></div><p class="note" id="note" hidden></p></div>
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }
</script>
<script type="module">
// The custom scene's build mode without the 3D room: the inventory (js/custom/inventory.js) mounted with a stub
// controller, and placement's pure helpers (js/custom/placement.js). Writes OK, or FAIL with the problems, to #qaResult.
const problems = [];
const ok = (cond, what) => { if (!cond) problems.push(what); };
const eq = (got, want, what) => { if (JSON.stringify(got) !== JSON.stringify(want)) problems.push(`${what}: got ${JSON.stringify(got)}, wanted ${JSON.stringify(want)}`); };
const near = (a, b, what, e = 1e-6) => ok(Math.abs(a - b) <= e, `${what}: ${a} vs ${b}`);
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const shown = (el) => !!el && getComputedStyle(el).display !== 'none' && !el.closest('[hidden]');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

try {
  const [{ CATALOG }, { CUSTOM_COPY: C }, { createInventory, tileOrder }, pl, lay] = await Promise.all([
    import('../js/custom/catalog.js'), import('../js/custom/copy.js'), import('../js/custom/inventory.js'), import('../js/custom/placement.js'), import('../js/custom/layout.js')]);

  // ---- the inventory, with a stub controller ----
  const added = []; let cleared = 0, room = new Set(), n = 0;
  const inv = createInventory($('#inventory'), { onAdd: (t) => added.push(t), onClear: () => { cleared++; }, inRoom: () => room, count: () => n, note: $('#note') });
  const root = $('#inventory'), tiles = () => $$('.inv-tile', root), visible = () => tiles().filter(shown).map((b) => b.dataset.type);
  const types = CATALOG.types;
  // pictures: every tile gets a rendered <img> within 5 s, and no long task (over 200 ms) holds the page while they fill
  const longTasks = []; try { new PerformanceObserver((l) => longTasks.push(...l.getEntries().map((e) => Math.round(e.duration)))).observe({ entryTypes: ['longtask'] }); } catch {}
  const [THREE, parts, { createThumbs }, { DEVICE_UI }] = await Promise.all([import('three'), import('../js/engine/parts.js'), import('../js/custom/thumbs.js'), import('../js/custom/devices/index.js')]);
  const thumbs = createThumbs({ THREE, parts }); longTasks.length = 0; // (module loading is not the pictures' cost)
  const t0 = performance.now(); let pending = 0; const firstUrl = {};
  for (const t of types) { pending++; thumbs.get(t.type).then((u) => { if (u) { firstUrl[t.type] = u; inv.setThumb(t.type, u); } else problems.push(`${t.type}: no picture`); }).finally(() => { pending--; }); }

  // 1. one tile per catalog type (54 once the catalog is complete), by category then table order
  eq(tiles().length, types.length, 'one tile per catalog type');
  if (types.length >= 54) eq(tiles().length, 54, 'the full catalog');
  const rank = (c) => CATALOG.categories.indexOf(c);
  const want = [...types].map((t, i) => [t, i]).sort((a, b) => rank(a[0].category) - rank(b[0].category) || a[1] - b[1]).map(([t]) => t.type);
  eq(tiles().map((b) => b.dataset.type), want, 'tile order');
  eq(tileOrder().map((t) => t.type), want, 'tileOrder()');
  for (const b of tiles()) {
    const t = types.find((x) => x.type === b.dataset.type);
    ok($('.pic svg, .pic img', b), `${t.type}: a picture`);
    eq([$('.nm', b).textContent, $('.cat', b).textContent], [t.name, t.category], `${t.type}: name and category`);
    eq(!!$('.new', b) && shown($('.new', b)), !!t.new, `${t.type}: "new" badge`);
    if ($('.new', b)) eq($('.new', b).textContent, C.isNew, 'new label');
    ok(!shown($('.in', b)), `${t.type}: no ✓ in an empty room`);
  }
  eq(visible().length, types.length, 'all tiles show at first');

  // 2. search "lamp" leaves the lamp types
  const search = $('.inv-search', root);
  eq(search.placeholder, C.search, 'search placeholder');
  search.value = 'lamp'; search.dispatchEvent(new Event('input'));
  const lamps = types.filter((t) => `${t.name} ${t.category}`.toLowerCase().includes('lamp')).map((t) => t.type);
  ok(lamps.length >= 1, 'the catalog has a lamp');
  eq([...visible()].sort(), [...lamps].sort(), 'search "lamp"');
  ok(!shown($('.inv-nomatch', root)), 'no "no match" line while something matches');
  search.value = 'zzzz'; search.dispatchEvent(new Event('input'));
  eq(visible(), [], 'search with no match'); ok(shown($('.inv-nomatch', root)) && $('.inv-nomatch', root).textContent === C.noMatch, 'the "no match" line');
  search.value = ''; search.dispatchEvent(new Event('input'));
  eq(visible().length, types.length, 'search cleared');

  // 3. the Lights chip filters (and All undoes it)
  const chips = $$('.inv-cat', root);
  eq(chips[0].textContent, C.all, 'All first');
  eq(chips.slice(1).map((b) => b.dataset.cat), CATALOG.categories.filter((c) => types.some((t) => t.category === c)), 'one chip per category in use');
  const lights = chips.find((b) => b.dataset.cat === 'Lights');
  ok(lights, 'a Lights chip');
  if (lights) {
    lights.click();
    eq([...visible()].sort(), types.filter((t) => t.category === 'Lights').map((t) => t.type).sort(), 'Lights chip');
    eq(lights.getAttribute('aria-pressed'), 'true', 'Lights pressed'); eq(chips[0].getAttribute('aria-pressed'), 'false', 'All released');
    search.value = 'lamp'; search.dispatchEvent(new Event('input'));
    eq([...visible()].sort(), types.filter((t) => t.category === 'Lights' && t.name.toLowerCase().includes('lamp')).map((t) => t.type).sort(), 'chip and search together');
    search.value = ''; search.dispatchEvent(new Event('input'));
    chips[0].click(); eq(visible().length, types.length, 'All');
  }

  // 4. a click calls onAdd(type)
  tiles()[0].click(); tiles().at(-1).click();
  eq(added, [tiles()[0].dataset.type, tiles().at(-1).dataset.type], 'onAdd per click');

  // 5. ✓ after a refresh with the type in the room; the count line and the empty-room note follow count()
  eq($('.inv-count', root).textContent, C.count(0), 'count line at 0');
  ok(shown($('#note')) && $('#note').textContent.includes(C.empty), 'the empty-room note while empty');
  room = new Set(['blinds', 'floor_lamp']); n = 3; inv.refresh();
  for (const b of tiles()) eq(shown($('.in', b)), room.has(b.dataset.type), `${b.dataset.type}: ✓ after refresh`);
  eq($('.inv-count', root).textContent, C.count(3), 'count line at 3');
  ok(!shown($('#note')), 'no empty-room note with devices');
  inv.refresh(); eq(tiles().filter((b) => shown($('.in', b))).length, 2, 'a second refresh changes nothing');

  // 6. Clear needs two clicks (the first one asks, for 3 s)
  const clear = $('.inv-clear', root);
  eq(clear.textContent, C.clear, 'Clear room label');
  clear.click(); eq(cleared, 0, 'the first click clears nothing'); eq(clear.textContent, C.clearConfirm(3), 'it asks');
  clear.click(); eq(cleared, 1, 'the second click clears'); eq(clear.textContent, C.clear, 'back to its label');
  clear.click(); await wait(3150); eq(clear.textContent, C.clear, 'the question goes after 3 s');
  clear.click(); eq(cleared, 1, 'and the next click asks again');
  room = new Set(); n = 0; inv.refresh(); ok(clear.disabled, 'nothing to clear in an empty room');

  // 7. nothing interactive inside a button (or a link)
  eq($$('button :is(button, a, input, select, textarea, [tabindex]), a :is(button, a, input)', root).length, 0, 'no interactive element nested in a button');
  for (const b of $$('button', root)) eq(b.type, 'button', 'every button is type=button');

  // 8. the phone sheet opens and closes; a thumbnail replaces the icon
  const grip = $('.inv-grip', root);
  inv.open(true); ok(root.classList.contains('open') && grip.getAttribute('aria-expanded') === 'true' && grip.getAttribute('aria-label') === C.sheetClose, 'open');
  inv.open(false); ok(!root.classList.contains('open') && grip.getAttribute('aria-expanded') === 'false', 'closed');
  inv.setThumb(tiles()[0].dataset.type, 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==');
  ok($('.pic img', tiles()[0]) && !$('.pic svg', tiles()[0]), 'setThumb');

  // pictures finish (checked last, below)
  ok(Object.keys(DEVICE_UI).length === types.length, 'a UI per type');
  // ---- placement's pure helpers ----
  const { rayPlane, hitOn, grabOffset, dragTo, isTap, selection, TAP_SLOP } = pl;
  const v = (x, y, z) => ({ x, y, z });
  const toward = (o, p) => { const d = v(p.x - o.x, p.y - o.y, p.z - o.z), l = Math.hypot(d.x, d.y, d.z); return v(d.x / l, d.y / l, d.z / l); };
  const cam = v(7, 4.2, 6.2);
  near(rayPlane(v(0, 2, 0), v(0, -1, 0), 'y', 0), 2, 'rayPlane down');
  eq(rayPlane(v(0, 2, 0), v(1, 0, 0), 'y', 0), null, 'rayPlane parallel');
  eq(rayPlane(v(0, 2, 0), v(0, 1, 0), 'y', 0), null, 'rayPlane behind');
  const f = hitOn('floor', cam, toward(cam, v(1.5, 0, -0.5))); near(f.x, 1.5, 'floor x'); near(f.z, -0.5, 'floor z');
  const c = hitOn('ceiling', cam, toward(cam, v(-1, 2.8, 1))); near(c.x, -1, 'ceiling x'); near(c.z, 1, 'ceiling z');
  eq(hitOn('floor', cam, v(0, 1, 0)), null, 'a ray to the sky misses the floor');
  const gh = hitOn('floor', cam, toward(cam, v(-3.7, 1.65, -2.7)), 1.65); near(gh.x, -3.7, 'grab-height plane x'); near(gh.z, -2.7, 'grab-height plane z');
  const wb = hitOn('wall', cam, toward(cam, v(0.5, 1.4, -3))); eq(wb.wall, 'back', 'back wall'); near(wb.x, 0.5, 'back wall x'); near(wb.z, -3, 'back wall z');
  const wl = hitOn('wall', cam, toward(cam, v(-4, 1.4, 1))); eq(wl.wall, 'left', 'left wall'); near(wl.z, 1, 'left wall z');
  const wf = hitOn('wall', cam, toward(cam, v(0.5, 0, 0))); eq([wf.wall, +wf.x.toFixed(6), +wf.z.toFixed(6)], ['back', 0.5, 0], 'over the floor: the floor point, nearer the back wall');
  eq(lay.clampPos('wall', wf, 0.5), { x: 0.5, z: -3 }, 'which clampPos puts on that wall');
  // the grab offset keeps the device where it was grabbed
  const g = grabOffset('floor', { x: 1, z: 1, rot: 0 }, { x: 1.2, z: 0.7 });
  const to = dragTo('floor', { x: 2.2, z: 0.2 }, g); near(to.x, 2, 'drag x'); near(to.z, 0.5, 'drag z');
  const gw = grabOffset('wall', { x: -1, z: -3, rot: 0 }, { x: -0.8, z: -3, wall: 'back' });
  const aw = dragTo('wall', { x: 0.2, z: -3, wall: 'back' }, gw); near(aw.x, 0, 'along the back wall x'); eq(aw.z, -3, 'along the back wall z');
  eq(dragTo('wall', { x: -4, z: 1, wall: 'left' }, gw), { x: -4, z: 1 }, 'onto the left wall: no offset');
  eq(grabOffset('wall', { x: -4, z: 1, rot: 90 }, { x: -1, z: -3, wall: 'back' }).along, 0, 'grabbed across the corner');
  // a tap is a press that moved TAP_SLOP px or less
  eq(TAP_SLOP, 6, 'slop'); ok(isTap({ x: 10, y: 10 }, { x: 14, y: 13 }), '5 px is a tap'); ok(!isTap({ x: 10, y: 10 }, { x: 17, y: 10 }), '7 px is a drag');
  // the selection bar: Rotate not for wall mounts or the hub, Remove not for the hub
  let L = lay.emptyLayout();
  for (const t of ['floor_lamp', 'blinds', 'floor_lamp']) L = lay.addDevice(L, t).layout;
  eq(selection(L, 'hub'), { id: 'hub', name: 'NeuCharBox', rotate: false, remove: false }, 'hub');
  eq(selection(L, 'floor_lamp_2'), { id: 'floor_lamp_2', name: 'Floor lamp 2', rotate: true, remove: true }, 'floor device');
  eq(selection(L, 'blinds'), { id: 'blinds', name: 'Blinds', rotate: false, remove: true }, 'wall device');
  eq(selection(L, 'nope'), null, 'not in the room');
  // wall devices keep off the window (layout.js WINDOW, back wall x 1.3 to 3.1)
  const W = lay.WINDOW, edgeL = W.x - W.ww / 2, edgeR = W.x + W.ww / 2;
  for (const x of [1.5, 2.0, 2.15, 2.25, 2.9]) {
    const p = lay.clampPos('wall', { x, z: -3 }, 0.3);
    ok(p.x + 0.15 <= edgeL || p.x - 0.15 >= edgeR, `wall device at x ${x} keeps off the window (${p.x})`);
  }
  ok(lay.clampPos('wall', { x: 2.9, z: -3 }, 1.2).x + 0.6 <= edgeL, 'a wide one goes left (no room on the right)');
  // (the pictures had 5 s from the start)
  await wait(Math.max(0, 5000 - (performance.now() - t0)));
  eq(pending, 0, 'all pictures drawn within 5 s');
  for (const t of types) {
    const img = $('.pic img', tiles().find((b) => b.dataset.type === t.type));
    ok(img && img.src.startsWith('data:image/png'), `${t.type}: tile has a data:image/png <img>`);
  }
  window.__thumbMs = Math.round(performance.now() - t0); window.__longTasks = longTasks;
  ok(Math.max(0, ...longTasks) <= 200, `long tasks while pictures filled: ${longTasks.join(', ')} ms`);
  // a second get is cached; dispose then get builds again
  const again = await thumbs.get(types[0].type); ok(again === firstUrl[types[0].type], 'cached picture');
  thumbs.dispose();
  const t2 = createThumbs({ THREE, parts }); const redo = await t2.get(types[0].type); ok(typeof redo === 'string', 'a fresh context draws again'); t2.dispose();
} catch (e) { problems.push(`threw: ${e?.stack || e}`); }

const out = $('#qaResult');
out.textContent = problems.length ? `FAIL (${problems.length})\n${problems.join('\n')}` : 'OK';
out.classList.toggle('bad', problems.length > 0);
</script>
</body>
</html>
